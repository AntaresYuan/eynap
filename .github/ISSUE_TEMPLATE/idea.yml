name: 想加个能力 / Feature idea
description: 先说要解决的问题，再说设想的做法
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 不是「想要什么功能」，是「现在什么事做不成」。
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法（可选）
  - type: checkboxes
    id: scope
    attributes:
      label: 这属于哪一层
      options:
        - label: 方法论本身 — 我知道这类改动更适合提到上游 SmileLiuuuu/ai-pm
        - label: 拆分结构 / 共享地基 / 宿主适配 — 属于本仓库
